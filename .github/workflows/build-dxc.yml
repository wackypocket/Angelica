name: Build angelica-dxc

on:
  push:
    tags:
      - "dxc-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish angelica-dxc.jar to the GTNH maven
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Compute version
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(bash .github/scripts/companion-version.sh dxc dxc)"
          echo "DXC_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build angelica-dxc.jar
        run: ./gradlew -PdxcVersion="$DXC_VERSION" :dxc:distJar
      - uses: actions/upload-artifact@v4
        with:
          name: angelica-dxc
          path: dxc/build/libs/angelica-dxc-*.jar
          if-no-files-found: error
      - name: Publish to GTNH maven
        if: github.ref_type == 'tag' || inputs.publish
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew -PpublishDxc=true -PdxcVersion="$DXC_VERSION" :dxc:publish
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash .github/scripts/release-companion-jar.sh dxc/build/libs/angelica-dxc-*.jar "DXC shader compiler for the Direct3D 12 backend on Windows (shader packs need it)."
